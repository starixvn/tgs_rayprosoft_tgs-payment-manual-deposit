include:
  - project: rayprosoft/tgs-ci-scripts
    ref: main
    file: GitLab/Templates/gitlab-job-templates.yml

variables:
  ImageName: pgtgs/payment-manualpay
  TgsSettingKey: payment-manual
  BuildCacheKey: Tgs.Payment.ManualDeposit.$CI_PIPELINE_IID
  HelmTemplateFolderName: manual

stages:
  - build
  - test
  - publish
  - deploy-dev
  - deploy-staging
  - deploy-prod

build-code:
  extends: .build-code-template

unit-test:
  extends: .build-code-template

push-nuget:
  stage: publish
  needs:
    - build-code      
    - unit-test
  only:
    - main
  cache:
    key: $BuildCacheKey
    untracked: true
    policy: pull
  script:
    - dotnet pack -c $BuildConfiguration "Tgs.Payment.ManualDeposit/Tgs.Payment.ManualDeposit.csproj" --no-build --no-restore
    - dotnet nuget push "Tgs.Payment.ManualDeposit/bin/$BuildConfiguration/*.nupkg" -s "raypro-baget" -k $NugetApiKey --skip-duplicate
  artifacts:
    name: Nuget
    untracked: false
    expire_in: "30 days"
    paths:
      - Tgs.Payment.ManualDeposit/bin/$BuildConfiguration/*.nupkg

push-docker-image:
  extends: .push-docker-image-template
  variables:
    project: Tgs.Payment.Manual/Tgs.Payment.Manual.csproj

push-k8s-template:
  extends: .push-k8s-template

deploy-dev:
  extends: .deploy-template
  variables:
    namespace: dev
    kube_config: KubeConfig_Raypro_dev
  environment:
    name: dev
  stage: deploy-dev
  needs:
    - push-nuget
    - push-docker-image
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: on_success

deploy-staging:
  extends: .deploy-template
  variables:
    namespace: staging
    kube_config: KubeConfig_Raypro_staging
  environment:
    name: staging
  stage: deploy-staging
  needs:
    - deploy-dev
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual

deploy-prod:
  extends: .deploy-template
  variables:
    namespace: prod
    kube_config: KubeConfig_Raypro_prod
  environment:
    name: prod
  stage: deploy-prod
  needs:
    - deploy-staging
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual
